name: Docs

on:
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build
        # docs/index.md is committed directly.
        # docs/{roadmap,contributing,changelog}.md are documentation copies
        # of the root-level canonical files with docs-relative links.
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name != 'pull_request'
        with: { path: site }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
